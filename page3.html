<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stay Connected!</title>


    <style>

    

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

          

            background: linear-gradient(
                135deg,
                #dbeafe,
                #c7d2fe,
                #e9d5ff
            );

            background-attachment: fixed;

            background-size: cover;

            color: white;

        }




        main {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;

        }


        
        .content {

            width: 100%;

            max-width: 850px;

            display: flex;

            flex-direction: column;

            align-items: flex-start;

        }


     

        h1 {

            font-size: 28px;

            font-weight: bold;

            color: white;

            margin-bottom: 25px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.25);

        }


       

        .social-list {

            display: flex;

            flex-direction: column;

            gap: 15px;

            width: 100%;

        }


       

        .social-item {

            display: flex;

            align-items: center;

            width: 100%;

        }


       
        .social-icon {

            width: 70px;

            height: 70px;

            object-fit: cover;

            margin-right: 15px;

            flex-shrink: 0;

        }



        .social-link {

            font-size: 17px;

            color: #3730a3;

            text-decoration: underline;

            font-weight: bold;

            text-shadow:
                0 1px 3px
                rgba(255, 255, 255, 0.5);

            cursor: pointer;

            transition: 0.2s ease;

        }


        .social-link:hover {

            color: #1e1b4b;

            transform: translateX(3px);

        }


        .social-link:focus {

            outline: 3px solid #f59e0b;

            outline-offset: 4px;

        }


    
        .buttons {

            display: flex;

            justify-content: center;

            width: 100%;

            margin-top: 25px;

        }


        .button {

            display: inline-block;

            padding: 10px 22px;

            background: #4f46e5;

            color: white;

            text-decoration: none;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;

            font-weight: bold;

            border-radius: 7px;

            transition: 0.2s ease;

            cursor: pointer;

        }


        .button:hover {

            background: #3730a3;

            transform: translateY(-2px);

        }


        .button:focus {

            outline: 3px solid #f59e0b;

            outline-offset: 3px;

        }


    
        @media (max-width: 600px) {

            main {

                padding: 20px 15px;

            }


            h1 {

                font-size: 23px;

            }


            .social-icon {

                width: 60px;

                height: 60px;

                margin-right: 10px;

            }


            .social-link {

                font-size: 14px;

            }

        }


        

        @media (prefers-reduced-motion: reduce) {

            * {

                transition: none !important;

            }

        }

    </style>

</head>


<body>


    

    <main>

        <section class="content">


            
            <h1>
                Stay Connected!
            </h1>


         
            <div class="social-list">


                <div class="social-item">

                    <img
                        src="instagram.png"
                        alt="Instagram"
                        class="social-icon"
                    >

                    <a
                        href="https://www.instagram.com/m_migzzz?stkn=MXdweTJ0bnhlZjdqZg==/"
                        target="_blank"
                        class="social-link"
                    >
                        Follow my adventures and inspirations on Instagram!
                    </a>

                </div>
            
                <div class="social-item">

                    <img
                        src="facebook.png"
                        alt="Facebook"
                        class="social-icon"
                    >

                    <a
                        href="https://www.facebook.com/miguel.turing.1/about"
                        target="_blank"
                        class="social-link"
                    >
                        Join the conversation on Facebook!
                    </a>

                </div>
            
            <div class="buttons">

                <a
                    href="next.html"
                    class="button"
                >
                    Back
                </a>

            </div>


        </section>

    </main>


</body>

</html>
