<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Turing Miguel Jhon G.</title>


    <style>

    

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


    
        body {

            min-height: 100vh;

            font-family:
                Georgia,
                "Times New Roman",
                serif;


            background: linear-gradient(
                135deg,
                #dbeafe,
                #c7d2fe,
                #e9d5ff
            );

            background-attachment: fixed;

            background-size: cover;

            color: #ffffff;
        }

        main {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;
        }
        .profile-section {

            width: 100%;

            max-width: 800px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .profile-picture {

            width: 260px;

            height: 260px;

            object-fit: cover;

            border-radius: 50%;

            border:
                6px solid
                rgba(255, 255, 255, 0.85);

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);

            margin-bottom: 15px;
        }


        .name-link {

            display: inline-block;

            color: #3730a3;

            text-decoration: underline;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 8px;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .name-link:hover {

            color: #1e1b4b;

            transform: scale(1.03);
        }


        .name-link:focus {

            outline:
                3px solid
                #f59e0b;

            outline-offset: 5px;

            border-radius: 5px;
        }


     
        .quote {

            max-width: 600px;

            font-size: 16px;

            font-style: italic;

            line-height: 1.6;

            color: #374151;
        }



        @media (max-width: 600px) {

            main {

                padding: 30px 15px;
            }


            .profile-picture {

                width: 210px;

                height: 210px;
            }


            .name-link {

                font-size: 23px;
            }


            .quote {

                font-size: 14px;
            }

        }


      

        @media (prefers-reduced-motion: reduce) {

            * {

                transition: none !important;
            }

        }

    </style>

</head>


<body>


    <main>

        <section class="profile-section">


            <!-- PROFILE PHOTO -->

            <img
                src="tub.jpg"
                alt="Portrait of Turing Miguel Jhon G."
                class="profile-picture"
            >


        
            <a
                href="next.html"
                class="name-link"
            >
                Miguel Jhon G. Turing
            </a>


            

            <p class="quote">

                "The road to success is filled with hard work,
                patience, and determination."

            </p>


        </section>

    </main>


</body>

</html>
